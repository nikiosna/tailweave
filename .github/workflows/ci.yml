name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TAILSCALE_VERSION: "1.102.5"
  # The runner is a throwaway Linux VM already; run make targets directly.
  NO_VM: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags lab ./...
      - run: go test ./...
      - run: go build ./cmd/...
      - name: macOS build
        env: { GOOS: darwin, GOARCH: arm64, CGO_ENABLED: "0" }
        run: go vet ./... && go vet -tags lab ./... && go build ./cmd/...

  lab:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y "tailscale=${TAILSCALE_VERSION}" iperf3 netcat-openbsd
          sudo systemctl disable --now tailscaled || true
          sudo sysctl -w net.ipv4.ip_forward=1
      - run: make lab-up SCENARIO=all
      - run: make test-lab GO_TEST_FLAGS=-v
      - run: make ui-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: lab/.state/ui/
          if-no-files-found: ignore
      - name: Lab logs
        if: failure()
        run: |
          make lab-status || true
          docker compose -f lab/compose.yaml logs --no-color | tail -300
          sudo tail -100 /var/lib/tailweave-lab/*/tailscaled.log || true
