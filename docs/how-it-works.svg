<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">How tailweave works</title>
  <desc id="desc">This machine runs tailweave: apps resolve names with tailweave's DNS service on 100.100.100.100 and reach peers through the tailweave router, which maps every peer 1:1 to its tailnet's Tailscale instance. The tailnets work and home both have a peer at 100.64.0.1; the one in work keeps its IP, the one in home appears on this machine as 198.18.0.1. Peers can connect to this machine too. Traffic between the tailnets, and from the LAN into the tailnets, is blocked.</desc>
  <style>
    svg { --bg: #f8fafc; --card: #ffffff; --line: #cbd5e1; --text: #0f172a; --muted: #64748b;
          --work: #2563eb; --work-soft: #eff6ff; --home: #0f766e; --home-soft: #f0fdfa;
          --map: #c2410c; --deny: #dc2626; --inner: #f1f5f9; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --card: #161b22; --line: #3d444d; --text: #e6edf3; --muted: #9198a1;
            --work: #58a6ff; --work-soft: #0f2340; --home: #3fd0b8; --home-soft: #0b2a27;
            --map: #f0883e; --deny: #f85149; --inner: #1c2128; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           fill: var(--text); font-size: 14px; }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .inner { fill: var(--inner); stroke: var(--line); stroke-width: 1; }
    .h { font-size: 16px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 12.5px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .work-box { fill: var(--work-soft); stroke: var(--work); stroke-width: 1.5; }
    .home-box { fill: var(--home-soft); stroke: var(--home); stroke-width: 1.5; }
    .work { fill: var(--work); }
    .home { fill: var(--home); }
    .map { fill: var(--map); }
    .deny-t { fill: var(--deny); font-weight: 600; }
    .a { fill: none; stroke-width: 2; }
    .a-muted { stroke: var(--muted); }
    .a-work { stroke: var(--work); }
    .a-home { stroke: var(--home); }
    .a-deny { stroke: var(--deny); stroke-dasharray: 6 5; }
    .x { stroke: var(--deny); stroke-width: 3; stroke-linecap: round; }
    .xbg { fill: var(--bg); }
    .m-muted { fill: var(--muted); }
    .m-work { fill: var(--work); }
    .m-home { fill: var(--home); }
    .m-deny { fill: var(--deny); }
  </style>
  <defs>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-muted" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ar-work" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-work" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ar-home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-home" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ar-deny-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="m-deny" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ar-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-deny" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="560" rx="12"/>

  <!-- This machine -->
  <rect class="card" x="20" y="20" width="430" height="420" rx="12"/>
  <text class="h" x="40" y="50">This machine</text>

  <rect class="inner" x="40" y="70" width="180" height="62" rx="8"/>
  <text class="b" x="56" y="96">Apps</text>
  <text class="s" x="56" y="117">browser, ssh, WebRTC, …</text>

  <rect class="inner" x="250" y="70" width="180" height="62" rx="8"/>
  <text class="b" x="266" y="96">DNS</text>
  <text class="mono" x="266" y="117">100.100.100.100</text>

  <path class="a a-muted" d="M220 101 H246" marker-end="url(#ar-muted)"/>

  <!-- router -->
  <rect class="inner" x="40" y="170" width="210" height="250" rx="8"/>
  <text class="b" x="56" y="196">tailweave router</text>
  <text class="s" x="56" y="215">1:1 NAT for every peer</text>
  <text class="s" x="56" y="250">local IP → tailnet</text>
  <text class="mono" x="56" y="280">100.64.0.1</text>
  <text class="mono work" x="66" y="299">→ work 100.64.0.1</text>
  <text class="mono map" x="56" y="370">198.18.0.1</text>
  <text class="mono home" x="66" y="389">→ home 100.64.0.1</text>

  <path class="a a-muted" d="M130 132 V166" marker-start="url(#ar-muted)" marker-end="url(#ar-muted)"/>

  <!-- instances -->
  <rect class="work-box" x="270" y="170" width="160" height="100" rx="8"/>
  <text class="b" x="286" y="198">work</text>
  <text class="s" x="286" y="219">Tailscale instance</text>
  <text class="s" x="286" y="238">own network stack</text>

  <rect class="home-box" x="270" y="320" width="160" height="100" rx="8"/>
  <text class="b" x="286" y="348">home</text>
  <text class="s" x="286" y="369">Tailscale instance</text>
  <text class="s" x="286" y="388">own network stack</text>

  <path class="a a-work" d="M250 220 H266" marker-end="url(#ar-work)"/>
  <path class="a a-home" d="M250 370 H266" marker-end="url(#ar-home)"/>

  <!-- tailnets -->
  <rect class="work-box" x="640" y="170" width="300" height="100" rx="12"/>
  <text class="h work" x="660" y="198">tailnet work</text>
  <rect class="card" x="660" y="212" width="130" height="44" rx="8"/>
  <text class="b" x="674" y="231">peer</text>
  <text class="mono" x="674" y="249">100.64.0.1</text>
  <text class="s" x="804" y="231">appears here as</text>
  <text class="mono" x="804" y="249">100.64.0.1</text>

  <rect class="home-box" x="640" y="320" width="300" height="100" rx="12"/>
  <text class="h home" x="660" y="348">tailnet home</text>
  <rect class="card" x="660" y="362" width="130" height="44" rx="8"/>
  <text class="b" x="674" y="381">peer</text>
  <text class="mono" x="674" y="399">100.64.0.1</text>
  <text class="s" x="804" y="381">appears here as</text>
  <text class="mono map" x="804" y="399">198.18.0.1</text>

  <!-- outbound / inbound -->
  <path class="a a-work" d="M430 208 H636" marker-end="url(#ar-work)"/>
  <text class="s" x="533" y="199" text-anchor="middle">outbound</text>
  <path class="a a-work" d="M640 236 H434" marker-end="url(#ar-work)"/>
  <text class="s" x="533" y="256" text-anchor="middle">inbound (tailnet ACLs)</text>

  <path class="a a-home" d="M430 358 H636" marker-end="url(#ar-home)"/>
  <text class="s" x="533" y="349" text-anchor="middle">outbound</text>
  <path class="a a-home" d="M640 386 H434" marker-end="url(#ar-home)"/>
  <text class="s" x="533" y="406" text-anchor="middle">inbound from 198.18.0.1</text>

  <!-- work x home -->
  <path class="a a-deny" d="M725 275 V315" marker-start="url(#ar-deny-s)" marker-end="url(#ar-deny-s)"/>
  <circle class="xbg" cx="725" cy="295" r="7"/>
  <path class="x" d="M720 290 L730 300 M730 290 L720 300"/>
  <text class="deny-t" x="742" y="300">work ✕ home</text>

  <!-- LAN x tailnets -->
  <rect class="card" x="20" y="470" width="200" height="70" rx="12"/>
  <text class="h" x="40" y="500">LAN</text>
  <text class="s" x="40" y="522">other devices, containers, VMs</text>
  <path class="a a-deny" d="M220 505 H880 V424" marker-end="url(#ar-deny)"/>
  <circle class="xbg" cx="505" cy="505" r="10"/>
  <path class="x" d="M498 498 L512 512 M512 498 L498 512"/>
  <text class="deny-t" x="505" y="490" text-anchor="middle">LAN ✕ tailnets</text>
</svg>
