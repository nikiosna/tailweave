# tailweave lab: two headscale control servers with deliberately identical IP ranges,
# plus tailscale peers in each tailnet, and Dex as OIDC provider for SSO logins. Driven by lab/scripts/*.sh, not meant for
# `docker compose up` on its own (peers need preauth keys from bootstrap.sh).
#
# Profiles add conflict scenarios:
#   subnets     overlapping subnet routes (A and B both route 10.99.0.0/24),
#               and a route equal to the Lima VM LAN, user-v2 (192.168.104.0/24)
#   exit-nodes  one exit node in each tailnet, both on the "internet" network wan, behind
#               which inet (198.51.100.10) answers HTTP with the address it was reached from

name: tailweave-lab

x-headscale: &headscale
  image: headscale/headscale:${HEADSCALE_VERSION:-0.29.4}
  command: serve
  restart: unless-stopped
  volumes:
    - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
  # headscale refuses to start until Dex answers and is restarted until then.
  depends_on: [dex]

x-peer: &peer
  build:
    context: ./peer
    args:
      TAILSCALE_VERSION: v${TAILSCALE_VERSION:-1.104.4}
  image: tailweave-lab-peer:${TAILSCALE_VERSION:-1.104.4}
  restart: unless-stopped
  devices:
    - /dev/net/tun:/dev/net/tun
  cap_add:
    - NET_ADMIN
    - NET_RAW
  sysctls:
    net.ipv4.ip_forward: "1"
    net.ipv6.conf.all.forwarding: "1"
    net.ipv6.conf.all.disable_ipv6: "0"

x-peer-a-env: &peer-a-env
  TS_AUTHKEY: ${KEY_A:-}
  TS_EXTRA_ARGS: --login-server=http://172.30.0.10:8080
  TS_USERSPACE: "false"
  TS_STATE_DIR: /var/lib/tailscale
  TS_ACCEPT_DNS: "false"

x-peer-b-env: &peer-b-env
  TS_AUTHKEY: ${KEY_B:-}
  TS_EXTRA_ARGS: --login-server=http://172.30.0.11:8080
  TS_USERSPACE: "false"
  TS_STATE_DIR: /var/lib/tailscale
  TS_ACCEPT_DNS: "false"

services:
  dex:
    image: ghcr.io/dexidp/dex:${DEX_VERSION:-v2.45.0}
    container_name: dex
    command: dex serve /etc/dex/config.yaml
    restart: unless-stopped
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      lab: { ipv4_address: 172.30.0.12 }

  headscale-a:
    <<: *headscale
    container_name: headscale-a
    environment:
      HEADSCALE_SERVER_URL: http://172.30.0.10:8080
      HEADSCALE_DNS_BASE_DOMAIN: ${A_BASE_DOMAIN:-a.lab}
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-a:/var/lib/headscale
    networks:
      lab: { ipv4_address: 172.30.0.10 }

  headscale-b:
    <<: *headscale
    container_name: headscale-b
    environment:
      HEADSCALE_SERVER_URL: http://172.30.0.11:8080
      HEADSCALE_DNS_BASE_DOMAIN: ${B_BASE_DOMAIN:-b.lab}
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-b:/var/lib/headscale
    networks:
      lab: { ipv4_address: 172.30.0.11 }

  # --- tailnet A -----------------------------------------------------------
  peer-a1:
    <<: *peer
    container_name: peer-a1
    hostname: peer-a1
    environment: { <<: *peer-a-env, TS_HOSTNAME: peer-a1 }
    volumes: [peer-a1:/var/lib/tailscale]
    networks: [lab]
  peer-a2:
    <<: *peer
    container_name: peer-a2
    hostname: peer-a2
    environment: { <<: *peer-a-env, TS_HOSTNAME: peer-a2 }
    volumes: [peer-a2:/var/lib/tailscale]
    networks: [lab]
  router-a:
    <<: *peer
    profiles: [subnets]
    container_name: router-a
    hostname: router-a
    environment:
      <<: *peer-a-env
      TS_HOSTNAME: router-a
      # 4via6 (site 7) for the same /24: tailscale debug via 7 10.99.0.0/24
      TS_ROUTES: 10.99.0.0/24,fd7a:115c:a1e0:b1a:0:7:a63:0/120
      LAB_EXTRA_ADDRS: 10.99.0.1/32
    volumes: [router-a:/var/lib/tailscale]
    networks: [lab]
  exit-a:
    <<: *peer
    profiles: [exit-nodes]
    container_name: exit-a
    hostname: exit-a
    environment:
      <<: *peer-a-env
      TS_HOSTNAME: exit-a
      LAB_EXTRA_ROUTES: 198.51.100.0/24=203.0.113.10
      TS_EXTRA_ARGS: --login-server=http://172.30.0.10:8080 --advertise-exit-node
    volumes: [exit-a:/var/lib/tailscale]
    networks:
      lab: { gw_priority: 1 }
      wan: { ipv4_address: 203.0.113.2 }

  # --- tailnet B -----------------------------------------------------------
  peer-b1:
    <<: *peer
    container_name: peer-b1
    hostname: peer-b1
    environment: { <<: *peer-b-env, TS_HOSTNAME: peer-b1 }
    volumes: [peer-b1:/var/lib/tailscale]
    networks: [lab]
  peer-b2:
    <<: *peer
    container_name: peer-b2
    hostname: peer-b2
    environment: { <<: *peer-b-env, TS_HOSTNAME: peer-b2 }
    volumes: [peer-b2:/var/lib/tailscale]
    networks: [lab]
  # Only in tailnet B and started last, so its IP does not collide with a peer in A.
  peer-b3:
    <<: *peer
    container_name: peer-b3
    hostname: peer-b3
    environment: { <<: *peer-b-env, TS_HOSTNAME: peer-b3 }
    volumes: [peer-b3:/var/lib/tailscale]
    networks: [lab]
  router-b:
    <<: *peer
    profiles: [subnets]
    container_name: router-b
    hostname: router-b
    environment:
      <<: *peer-b-env
      TS_HOSTNAME: router-b
      # 4via6 (site 8): tailscale debug via 8 10.99.0.0/24
      TS_ROUTES: 10.99.0.0/24,192.168.104.0/24,fd7a:115c:a1e0:b1a:0:8:a63:0/120
      LAB_EXTRA_ADDRS: 10.99.0.1/32
    volumes: [router-b:/var/lib/tailscale]
    networks: [lab]
  exit-b:
    <<: *peer
    profiles: [exit-nodes]
    container_name: exit-b
    hostname: exit-b
    environment:
      <<: *peer-b-env
      TS_HOSTNAME: exit-b
      LAB_EXTRA_ROUTES: 198.51.100.0/24=203.0.113.10
      TS_EXTRA_ARGS: --login-server=http://172.30.0.11:8080 --advertise-exit-node
    volumes: [exit-b:/var/lib/tailscale]
    networks:
      lab: { gw_priority: 1 }
      wan: { ipv4_address: 203.0.113.3 }

  # The internet as seen through an exit node: inet answers HTTP on 198.51.100.10 with the
  # address a request came from, the exit node's address on wan, as exit nodes masquerade.
  # The address sits behind inet's wan address, one hop away from the exit nodes: an exit
  # node does not let its clients into networks it is attached to.
  inet:
    image: tailweave-lab-peer:${TAILSCALE_VERSION:-1.104.4}
    profiles: [exit-nodes]
    container_name: inet
    hostname: inet
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    # socat mangles quotes, so no printf; curl takes the bare line ends.
    entrypoint:
      - sh
      - -c
      - >-
        ip addr add 198.51.100.10/32 dev lo &&
        exec socat TCP-LISTEN:80,fork,reuseaddr
        'SYSTEM:echo HTTP/1.0 200 OK; echo; echo $$SOCAT_PEERADDR'
    networks:
      wan: { ipv4_address: 203.0.113.10 }

networks:
  lab:
    driver_opts:
      com.docker.network.bridge.name: twlab0
      # Docker >= 28 drops traffic to container IPs that does not come from the bridge itself.
      # The DUT's network namespaces route to the headscales from outside, so disable that.
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

  # Only the exit nodes and inet are on it. Without an address on the bridge, the VM has
  # no route there: 198.51.100.10 is reachable only through an exit node.
  wan:
    driver_opts:
      com.docker.network.bridge.name: twwan0
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 203.0.113.0/24
          ip_range: 203.0.113.128/25

volumes:
  headscale-a:
  headscale-b:
  peer-a1:
  peer-a2:
  router-a:
  exit-a:
  peer-b1:
  peer-b2:
  peer-b3:
  router-b:
  exit-b:
