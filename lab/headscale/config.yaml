# Shared config for all lab headscale instances.
# Per-instance values (server_url, dns.base_domain) come from HEADSCALE_* env vars in compose.yaml.
#
# All instances use the same prefix with sequential allocation, so the first node in every
# tailnet gets 100.64.0.1. That collision is intentional.

server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true

node:
  expiry: 0

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: text

# Empty path: no ACL policy, every node can reach every other node.
policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: example.lab
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
taildrop:
  enabled: false
oidc:
  # Dex in the lab (lab/dex/config.yaml). Preauth keys keep working next to it.
  only_start_if_oidc_is_available: true
  issuer: http://172.30.0.12:5556/dex
  client_id: headscale
  client_secret: lab-oidc-secret
  scope: ["openid", "profile", "email"]
